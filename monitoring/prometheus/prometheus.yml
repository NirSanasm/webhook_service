global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    environment: "local"
    project: "webhook-delivery-lab"

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # alertmanager:9093

# Load alerting rules from files
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    metrics_path: /metrics

  # Webhook API service
  - job_name: "webhook-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # Delivery worker service
  - job_name: "webhook-worker"
    static_configs:
      - targets: ["delivery-worker:9091"]
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # Outbox publisher service
  - job_name: "outbox-publisher"
    static_configs:
      - targets: ["outbox-publisher:9092"]
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # RabbitMQ (via prometheus plugin)
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # OpenTelemetry Collector
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
